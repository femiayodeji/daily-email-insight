<!DOCTYPE html>
<html>
<head>
    <title>Daily Email Insight</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            display: flex;
            flex: 1;
            height: 90vh;
            max-width: 1100px;
            margin: 40px auto 0 auto;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(60,64,67,0.13);
            overflow: hidden;
        }

        /* ─── Summary Panel ─── */
        .summary-panel {
            flex: 1.1;
            padding: 36px 28px 36px 28px;
            border-right: 1.5px solid #e3e8ee;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 320px;
            position: relative;
            overflow: hidden;
            background: none;
        }

        /* GIF background layer */
        .summary-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('https://cdn.dribbble.com/userupload/23193457/file/original-ab5a6ee6e7694ff122e4da5761925940.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
        }

        /* Dark overlay on top of the GIF for readability */
        .summary-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 20, 0.52);
            z-index: 1;
        }

        .summary-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 18px;
            position: relative;
            z-index: 2;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        #summaryContent {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
            padding: 12px;
            min-height: 490px;
            max-height: 490px;
            width: 100%;
            color: #eef2f7;
            font-size: 0.8rem;
            word-break: break-word;
            animation: fadeIn 0.7s;
            overflow-y: auto;
            position: relative;
            z-index: 2;
            box-sizing: border-box;
        }

        #summaryContent::-webkit-scrollbar { width: 6px; }
        #summaryContent::-webkit-scrollbar-track { background: transparent; }
        #summaryContent::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

        #summaryContent a {
            color: #ef4444;
            text-decoration: underline;
            transition: color 0.2s;
        }

        #summaryContent a:hover,
        #summaryContent a:active {
            color: #fbbf24;
        }

        .summary-actions {
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: flex-end;
            width: 100%;
            margin-top: auto;
            margin-bottom: 0;
            position: relative;
            z-index: 2;
        }

        .summary-actions button {
            padding: 7px 14px;
            font-size: 0.95rem;
            border-radius: 7px;
            border: none;
            background: linear-gradient(90deg, #4f8cff 0%, #2563eb 100%);
            color: #fff;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(79,140,255,0.15);
            transition: background 0.18s, box-shadow 0.18s;
        }

        .summary-actions button:hover {
            background: linear-gradient(90deg, #2563eb 0%, #4f8cff 100%);
            box-shadow: 0 2px 8px rgba(79,140,255,0.3);
        }

        .summary-actions button:disabled,
        #getSummaryBtn:disabled {
            background: #e5e7eb !important;
            color: #a1a1aa !important;
            border: 1.5px solid #d1d5db !important;
            cursor: not-allowed !important;
            opacity: 0.7;
            box-shadow: none !important;
        }

        #logoutBtn {
            background: #fff0f0 !important;
            color: #e11d48 !important;
            font-size: 0.85rem !important;
            border: 1.5px solid #e11d48 !important;
            font-weight: 600;
            padding: 6px 12px !important;
            box-shadow: none !important;
        }

        #logoutBtn:hover {
            background: #ffe4e6 !important;
            color: #e11d48 !important;
            border: 1.5px solid #e11d48 !important;
        }

        /* ─── Chat Panel ─── */
        .chat-panel {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background: #f5f7fa;
            padding: 0;
            position: relative;
        }

        .chat-header {
            padding: 28px 32px 0 32px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #2563eb;
        }

            .processing-indicator {
                align-self: flex-start;
                background: #fff;
                color: #2563eb;
                border: 1.5px dashed #c7d2fe;
                border-radius: 18px;
                padding: 10px 16px;
                font-size: 0.86rem;
                font-weight: 600;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }

            .processing-pulse {
                display: inline-block;
                width: 8px;
                height: 8px;
                border-radius: 999px;
                background: #2563eb;
                animation: pulse 1s ease-in-out infinite;
            }

        #chatHistory {
            flex: 1;
            padding: 24px 32px 12px 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #chatHistory::-webkit-scrollbar { width: 6px; }
        #chatHistory::-webkit-scrollbar-track { background: transparent; }
        #chatHistory::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

        .user, .assistant {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.5;
            box-shadow: 0 2px 8px rgba(60,64,67,0.07);
            animation: popIn 0.3s;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(90deg, #4f8cff 0%, #2563eb 100%);
            color: #fff;
        }

        .assistant {
            align-self: flex-start;
            background: #fff;
            color: #23243a;
            border: 1.5px solid #e3e8ee;
        }

        /* ─── Chat Input ─── */
        .chat-input-row {
            display: flex;
            align-items: center;
            padding: 18px 32px 24px 32px;
            background: #f5f7fa;
            border-top: 1.5px solid #e3e8ee;
        }

        #textInput {
            flex: 1;
            padding: 13px 14px;
            border: 1.5px solid #e0e1e7;
            border-radius: 8px;
            font-size: 1.08rem;
            background: #f9fafe;
            margin-right: 12px;
            transition: border 0.2s;
        }

        #textInput::placeholder { color: #94a3b8; }

        #textInput:focus {
            border: 1.5px solid #4f8cff;
            outline: none;
            background: #fff;
        }

        #processBtn {
            padding: 13px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #4f8cff 0%, #2563eb 100%);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        #processBtn:hover {
            box-shadow: 0 2px 12px rgba(79, 140, 255, 0.35);
            transform: translateY(-1px);
        }

        /* ─── Audio Player ─── */
        #audioPlayer {
            width: 100%;
            margin-bottom: 14px;
            position: relative;
            z-index: 2;
        }

        /* ─── Login button ─── */
        #loginBtn {
            padding: 14px 32px;
            font-size: 1rem;
            border-radius: 8px;
            border: none;
            background: linear-gradient(90deg, #4f8cff 0%, #2563eb 100%);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(79,140,255,0.2);
            transition: all 0.3s;
        }

        #loginBtn:hover {
            box-shadow: 0 4px 16px rgba(79,140,255,0.35);
            transform: translateY(-1px);
        }

        /* ─── Loaders ─── */
        #summaryLoader, #ttsLoader {
            color: #fff !important;
            font-weight: 600;
            position: relative;
            z-index: 2;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
        }

        /* ─── Responsive ─── */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                border-radius: 0;
                margin: 0;
            }
            .summary-panel, .chat-panel {
                min-width: 0;
                width: 100%;
                border-radius: 0;
                border-right: none;
                border-bottom: 1.5px solid #e3e8ee;
            }
            .chat-panel { border-bottom: none; }
        }

        /* ─── Keyframes ─── */
        @keyframes popIn {
            0%   { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1);    opacity: 1; }
        }
        @keyframes fadeIn {
            0%   { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes pulse {
            0%   { transform: scale(0.8); opacity: 0.35; }
            50%  { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.35; }
        }
    </style>
</head>
<body>
    <div id="login-section" style="display:block; text-align:center; margin-top: 48px;">
        <button id="loginBtn" onclick="window.location.href='/login'">Login with Google</button>
    </div>
    <div id="app-section" style="display:none;">
        <div class="container">
            <div class="summary-panel">
                <div class="summary-title">Today's Inbox Summary</div>
                <audio id="audioPlayer" style="display:none;"></audio>
                <div id="summaryLoader" style="display:none; text-align:center; margin-bottom:10px;">Getting summary...</div>
                <div id="ttsLoader"     style="display:none; text-align:center; margin-bottom:10px;">Getting audio...</div>
                <div id="summaryContent">No summary yet.</div>
                <div class="summary-actions">
                    <button id="getSummaryBtn" onclick="getSummary()" style="display:none;">Summarise Email</button>
                    <button id="logoutBtn"     onclick="logout()"     style="display:none;">Logout</button>
                </div>
            </div>
            <div class="chat-panel">
                <div class="chat-header">Chat &amp; Query</div>
                <div id="chatHistory"></div>
                <div class="chat-input-row">
                    <input  type="text" id="textInput"  placeholder="Type your message..." style="display:none;">
                    <button id="processBtn" onclick="processText()" style="display:none;">Send</button>
                    <button id="interruptBtn" onclick="muteAudio()" style="display:none; margin-left:8px; background:#fff0f0; color:#e11d48; border:1.5px solid #e11d48; border-radius:8px; padding: 13px 16px; font-weight:600; cursor:pointer;">Mute</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isAuthenticated = false;
        let voiceSocket = null;
        let voiceReady = false;
        let activeTurnId = null;
        let activeAssistantDiv = null;
        let activeTurnBuffer = '';
        let activeSelectedTool = '';
        let pendingAudioMeta = [];
        let audioQueue = [];
        let isAudioPlaying = false;
        let currentAudioUrl = null;

        function createTurnId() {
            if (window.crypto && window.crypto.randomUUID) {
                return window.crypto.randomUUID();
            }
            return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        async function connectVoiceSocket() {
            if (voiceSocket && (voiceSocket.readyState === WebSocket.OPEN || voiceSocket.readyState === WebSocket.CONNECTING)) {
                return;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            voiceSocket = new WebSocket(`${protocol}://${window.location.host}/ws/voice`);
            voiceSocket.binaryType = 'blob';

            voiceSocket.onopen = () => {
                voiceReady = false;
            };

            voiceSocket.onmessage = async (event) => {
                if (typeof event.data === 'string') {
                    try {
                        const payload = JSON.parse(event.data);
                        await handleVoiceJson(payload);
                    } catch (e) {
                        console.error('WebSocket JSON parse error:', e);
                    }
                    return;
                }

                await handleVoiceAudioChunk(event.data);
            };

            voiceSocket.onclose = () => {
                voiceReady = false;
                voiceSocket = null;
            };

            voiceSocket.onerror = (e) => {
                console.error('WebSocket error:', e);
            };
        }

        function disconnectVoiceSocket() {
            if (voiceSocket) {
                voiceSocket.close();
            }
            voiceReady = false;
            voiceSocket = null;
            clearAudioPlaybackQueue();
        }

        function sendVoiceMessage(payload) {
            if (!voiceSocket || voiceSocket.readyState !== WebSocket.OPEN) return false;
            voiceSocket.send(JSON.stringify(payload));
            return true;
        }

        async function waitForVoiceReady(timeoutMs = 2000) {
            const startedAt = Date.now();
            while (Date.now() - startedAt < timeoutMs) {
                if (voiceSocket && voiceSocket.readyState === WebSocket.OPEN && voiceReady) {
                    return true;
                }
                await new Promise((resolve) => setTimeout(resolve, 40));
            }
            return false;
        }

        async function handleVoiceJson(payload) {
            const processBtn = document.getElementById('processBtn');
            const summaryContent = document.getElementById('summaryContent');

            if (payload.type === 'ready') {
                voiceReady = true;
                return;
            }

            if (payload.type === 'turn_started' && payload.turn_id === activeTurnId) {
                activeSelectedTool = payload.selected_tool || '';
                return;
            }

            if (payload.type === 'llm_delta' && payload.turn_id === activeTurnId) {
                const processingNode = document.getElementById('activeProcessingIndicator');
                if (processingNode) {
                    processingNode.remove();
                }

                if (!activeAssistantDiv) {
                    activeAssistantDiv = appendMessage('assistant', '');
                }
                activeTurnBuffer += payload.delta || '';
                if (activeAssistantDiv) {
                    if (activeSelectedTool === 'summarize_emails') {
                        summaryContent.innerHTML = marked.parse(stripToolBadge(activeTurnBuffer));
                    } else {
                        activeAssistantDiv.innerHTML = marked.parse(activeTurnBuffer);
                    }
                }
                return;
            }

            if (payload.type === 'tts_chunk_meta' && payload.turn_id === activeTurnId) {
                pendingAudioMeta.push(payload);
                return;
            }

            if (payload.type === 'llm_done' && payload.turn_id === activeTurnId) {
                processBtn.disabled = false;
                const processingNode = document.getElementById('activeProcessingIndicator');
                if (processingNode) {
                    processingNode.remove();
                }

                if (activeSelectedTool === 'summarize_emails' && activeAssistantDiv) {
                    activeAssistantDiv.innerHTML = marked.parse('I added your email summary to the summary panel on the left.');
                }
                activeTurnId = null;
                activeSelectedTool = '';
                activeTurnBuffer = '';
                activeAssistantDiv = null;
                return;
            }

            if (payload.type === 'interrupted') {
                if (payload.turn_id && activeTurnId && payload.turn_id !== activeTurnId) {
                    return;
                }
                processBtn.disabled = false;
                const processingNode = document.getElementById('activeProcessingIndicator');
                if (processingNode) {
                    processingNode.remove();
                }
                activeTurnId = null;
                activeSelectedTool = '';
                activeTurnBuffer = '';
                activeAssistantDiv = null;
                return;
            }

            if (payload.type === 'error') {
                if (payload.turn_id && payload.turn_id !== activeTurnId) {
                    return;
                }

                if (payload.stage === 'tts') {
                    console.warn('TTS segment error:', payload.message || payload);
                    return;
                }

                console.error('Voice pipeline error:', payload.message || payload);
                processBtn.disabled = false;
                const processingNode = document.getElementById('activeProcessingIndicator');
                if (processingNode) {
                    processingNode.remove();
                }
                if (activeAssistantDiv) {
                    activeAssistantDiv.innerHTML = marked.parse('Sorry, there was an error in the streaming voice pipeline.');
                }
            }
        }

        async function handleVoiceAudioChunk(blob) {
            if (!activeTurnId) return;
            if (!pendingAudioMeta.length) return;

            const processingNode = document.getElementById('activeProcessingIndicator');
            if (processingNode) {
                processingNode.remove();
            }

            const meta = pendingAudioMeta.shift();
            if (!meta || meta.turn_id !== activeTurnId) return;

            const audioUrl = URL.createObjectURL(blob);
            audioQueue.push({ audioUrl, meta });
            await playNextAudioChunk();
        }

        async function playNextAudioChunk() {
            const audioPlayer = document.getElementById('audioPlayer');
            if (isAudioPlaying || !audioQueue.length) return;

            isAudioPlaying = true;
            document.getElementById('interruptBtn').style.display = 'inline-block';
            const item = audioQueue.shift();
            currentAudioUrl = item.audioUrl;

            audioPlayer.src = currentAudioUrl;
            audioPlayer.load();

            const cleanup = () => {
                if (currentAudioUrl) {
                    URL.revokeObjectURL(currentAudioUrl);
                }
                currentAudioUrl = null;
                isAudioPlaying = false;
                if (!audioQueue.length) {
                    document.getElementById('interruptBtn').style.display = 'none';
                }
                playNextAudioChunk();
            };

            audioPlayer.onended = cleanup;
            audioPlayer.onerror = cleanup;

            try {
                await audioPlayer.play();
            } catch (e) {
                cleanup();
            }
        }

        function clearAudioPlaybackQueue() {
            const audioPlayer = document.getElementById('audioPlayer');
            pendingAudioMeta = [];

            for (const item of audioQueue) {
                URL.revokeObjectURL(item.audioUrl);
            }
            audioQueue = [];

            if (currentAudioUrl) {
                URL.revokeObjectURL(currentAudioUrl);
                currentAudioUrl = null;
            }

            audioPlayer.pause();
            audioPlayer.removeAttribute('src');
            audioPlayer.load();

            isAudioPlaying = false;
            document.getElementById('interruptBtn').style.display = 'none';
        }

        async function checkAuth() {
            try {
                const response = await fetch('/auth/check');
                if (response.ok) {
                    isAuthenticated = true;
                    document.getElementById('login-section').style.display  = 'none';
                    document.getElementById('app-section').style.display   = 'block';
                    document.getElementById('getSummaryBtn').style.display = 'inline-block';
                    document.getElementById('logoutBtn').style.display     = 'inline-block';
                    document.getElementById('textInput').style.display     = 'inline-block';
                    document.getElementById('processBtn').style.display    = 'inline-block';
                    document.getElementById('interruptBtn').style.display  = 'none';
                    await connectVoiceSocket();
                } else {
                    isAuthenticated = false;
                    document.getElementById('login-section').style.display = 'block';
                    document.getElementById('app-section').style.display   = 'none';
                    disconnectVoiceSocket();
                }
            } catch (e) {
                isAuthenticated = false;
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('app-section').style.display   = 'none';
                disconnectVoiceSocket();
            }
        }

        function appendMessage(role, text) {
            const chatHistory = document.getElementById('chatHistory');
            const msgDiv = document.createElement('div');
            msgDiv.className = role;
            msgDiv.innerHTML = marked.parse(text);
            chatHistory.appendChild(msgDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return msgDiv;
        }

        function stripToolBadge(text) {
            return text.replace(/^\s*\*?\[(Searching emails|Summarizing emails|Answering from context)\]\*?\s*/m, '');
        }

        async function playSummaryAudio(text) {
            const ttsLoader   = document.getElementById('ttsLoader');
            const audioPlayer = document.getElementById('audioPlayer');
            const cleanedText = stripToolBadge(text).trim();

            if (!cleanedText) return;

            ttsLoader.style.display   = 'block';

            try {
                const ttsResponse = await fetch('/tts', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ text: cleanedText })
                });

                if (!ttsResponse.ok) return;

                const blob = await ttsResponse.blob();
                const audioUrl = URL.createObjectURL(blob);
                audioPlayer.src = audioUrl;
                audioPlayer.onended = () => {
                    URL.revokeObjectURL(audioUrl);
                };
                audioPlayer.onerror = () => {
                    URL.revokeObjectURL(audioUrl);
                };
                audioPlayer.load();
                audioPlayer.play();
            } catch (e) {
                console.error('TTS error:', e);
            } finally {
                ttsLoader.style.display = 'none';
            }
        }

        async function streamToElement(response, element, options = {}) {
            const { onChunk, scrollContainer, render = true } = options;
            let buffer = '';
            let fullText = '';

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            async function typeText(text) {
                for (let char of text) {
                    buffer += char;
                    if (render) {
                        element.innerHTML = marked.parse(buffer);
                        if (scrollContainer) {
                            scrollContainer.scrollTop = scrollContainer.scrollHeight;
                        }
                    }
                    await new Promise(res => setTimeout(res, 5));
                }
            }

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value, { stream: true });
                fullText += chunk;
                if (onChunk) onChunk(chunk);
                await typeText(chunk);
            }

            return fullText;
        }

        async function processText() {
            if (!isAuthenticated) { alert('Please login first'); return; }
            const text = document.getElementById('textInput').value;
            if (!text.trim()) return;

            const processBtn = document.getElementById('processBtn');

            if (!voiceSocket || voiceSocket.readyState !== WebSocket.OPEN || !voiceReady) {
                await connectVoiceSocket();
            }

            const ready = await waitForVoiceReady();
            if (!ready) {
                alert('Voice channel not ready yet. Please try again.');
                return;
            }

            if (activeTurnId) {
                sendVoiceMessage({ type: 'interrupt', turn_id: activeTurnId });
                clearAudioPlaybackQueue();
            }

            processBtn.disabled = true;

            appendMessage('user', text);
            document.getElementById('textInput').value = '';

            const chatHistory = document.getElementById('chatHistory');
            const existingProcessing = document.getElementById('activeProcessingIndicator');
            if (existingProcessing) {
                existingProcessing.remove();
            }
            const processingDiv = document.createElement('div');
            processingDiv.id = 'activeProcessingIndicator';
            processingDiv.className = 'processing-indicator';
            processingDiv.innerHTML = '<span>Processing</span><span class="processing-pulse"></span>';
            chatHistory.appendChild(processingDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            activeTurnId = createTurnId();
            activeAssistantDiv = null;
            activeTurnBuffer = '';
            activeSelectedTool = '';
            pendingAudioMeta = [];

            try {
                const sent = sendVoiceMessage({
                    type: 'user_text',
                    turn_id: activeTurnId,
                    text,
                });

                if (!sent) {
                    processingDiv.remove();
                    appendMessage('assistant', 'Voice websocket is not connected.');
                    processBtn.disabled = false;
                }
            } catch (e) {
                processingDiv.remove();
                appendMessage('assistant', 'Sorry, there was an error.');
                processBtn.disabled = false;
            }
        }

        function muteAudio() {
            clearAudioPlaybackQueue();
        }

        async function getSummary() {
            if (!isAuthenticated) { alert('Please login first'); return; }

            const summaryContent = document.getElementById('summaryContent');
            const getSummaryBtn  = document.getElementById('getSummaryBtn');
            const summaryLoader  = document.getElementById('summaryLoader');
            const ttsLoader      = document.getElementById('ttsLoader');
            const audioPlayer    = document.getElementById('audioPlayer');

            getSummaryBtn.disabled          = true;
            summaryLoader.style.display     = 'block';
            ttsLoader.style.display         = 'none';
            audioPlayer.style.display       = 'none';
            summaryContent.textContent      = '';

            try {
                const response = await fetch('/summary');
                if (response.status === 401) {
                    alert('Session expired or invalid. Please login again.');
                    isAuthenticated = false;
                    document.getElementById('login-section').style.display = 'block';
                    document.getElementById('app-section').style.display   = 'none';
                    summaryLoader.style.display = 'none';
                    getSummaryBtn.disabled      = false;
                    return;
                }

                const summaryText = await streamToElement(response, summaryContent);

                summaryLoader.style.display = 'none';

                if (summaryText.trim()) {
                    await playSummaryAudio(summaryText);
                } else {
                    summaryContent.innerHTML = marked.parse('No summary available.');
                }
            } catch (e) {
                summaryContent.innerHTML    = marked.parse('Error fetching summary.');
                summaryLoader.style.display = 'none';
                ttsLoader.style.display     = 'none';
            } finally {
                getSummaryBtn.disabled = false;
            }
        }

        function logout() {
            disconnectVoiceSocket();
            fetch('/logout').then(() => { window.location.reload(); });
        }

        document.addEventListener('DOMContentLoaded', function () {
            checkAuth();
            setInterval(checkAuth, 30000);
            document.getElementById('textInput').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') processText();
            });
        });
    </script>
</body>
</html>
